[project]
name = "ai-trading-team"
version = "4.39.0"
description = "AI Trading Team v4.39.0 — integrated instrument-aware news catalyst analyst"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "MetaTrader5>=5.0.45",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
quant = ["numpy>=1.24", "scipy>=1.10"]
quantlib = ["QuantLib==1.44"]
ml = ["numpy>=1.24", "scikit-learn>=1.3"]
news = ["praw>=7.7", "vaderSentiment>=3.3.2", "textblob>=0.18"]
finance = ["numpy>=2.0,<3", "pandas>=2.2,<4", "scipy>=1.14,<2", "scikit-learn>=1.5,<2", "statsmodels>=0.14.4,<1", "yfinance>=0.2.65,<2", "lxml>=5,<7", "vaderSentiment>=3.3.2,<4", "openpyxl>=3.1,<4", "matplotlib>=3.9,<4"]
finance-neural = ["torch>=2.6,<3"]
finance-prophet = ["prophet>=1.1.6,<2"]

[project.scripts]
ai-trading-team = "trading_team.main:run_once"
ai-trading-dashboard = "trading_team.web.app:serve"
ai-trading-supervisor = "trading_team.monitor.supervisor:main"
ai-trading-guardian = "trading_team.monitor.guardian:main"
ai-trading-backtest = "trading_team.backtest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: tests that contact external data providers or live services"]
